<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoni Birkoni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-gradient: radial-gradient(circle at center, #1b1d24 0%, #0a0b0e 100%);
        --primary-glow: rgba(0, 242, 254, 0.4);
        --secondary-glow: rgba(79, 172, 254, 0.4);
        --accent-cyan: #00f2fe;
        --accent-blue: #4facfe;
        --text-color: #f0f3f8;
      }

      body {
        font-family: 'Outfit', sans-serif;
        margin: 0;
        padding: 0;
        background: var(--bg-gradient);
        color: var(--text-color);
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      #game-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85),
                    0 0 0 1px rgba(255, 255, 255, 0.08);
        background-color: #000;
        width: 100vw;
        height: 75vw; /* 4:3 aspect ratio */
        max-width: 100%;
        max-height: 100%;
      }

      @media (min-aspect-ratio: 4/3) {
        #game-container {
          height: 100vh;
          width: 133.33vh;
        }
      }

      canvas {
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
        display: block;
        touch-action: none;
      }

      /* Loading overlay style */
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg-gradient);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                    visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #loading-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .spinner-container {
        position: relative;
        width: 90px;
        height: 90px;
        margin-bottom: 28px;
      }

      .spinner {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        border: 4px solid rgba(255, 255, 255, 0.05);
        border-top-color: var(--accent-cyan);
        border-bottom-color: var(--accent-blue);
        border-radius: 50%;
        animation: rotate 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }

      .spinner-glow {
        position: absolute;
        top: -8px;
        left: -8px;
        right: -8px;
        bottom: -8px;
        border-radius: 50%;
        box-shadow: 0 0 30px var(--primary-glow);
        animation: pulse 1.5s ease-in-out infinite alternate;
        pointer-events: none;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        from { transform: scale(0.92); opacity: 0.4; }
        to { transform: scale(1.04); opacity: 0.95; }
      }

      .loading-text {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-blue) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
      }

      #status {
        font-size: 14px;
        color: #7b8196;
        font-weight: 400;
        height: 20px;
        letter-spacing: 0.5px;
      }

      .progress-bar-container {
        width: 280px;
        height: 4px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 20px;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
        border-radius: 2px;
        transition: width 0.25s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="loading-overlay">
      <div class="spinner-container">
        <div class="spinner"></div>
        <div class="spinner-glow"></div>
      </div>
      <div class="loading-text">Yoni Birkoni</div>
      <div id="status">Preparing game assets...</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>

    <div id="game-container">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var canvasElement = document.getElementById('canvas');
      var loadingOverlay = document.getElementById('loading-overlay');

      canvasElement.addEventListener('webglcontextlost', (e) => {
        alert('WebGL context lost. You will need to reload the page.');
        e.preventDefault();
      }, false);

      var setStatus = (text) => {
        if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
        if (text === setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - setStatus.last.time < 30) return;
        setStatus.last.time = now;
        setStatus.last.text = text;
        if (m) {
          text = m[1];
          var value = parseInt(m[2]);
          var max = parseInt(m[4]);
          var percentage = Math.round((value / max) * 100);
          progressElement.style.width = percentage + '%';
        } else {
          if (!text) {
            // Empty text indicates that the app is running
            progressElement.style.width = '100%';
            loadingOverlay.classList.add('fade-out');
            setTimeout(() => {
              canvasElement.focus();
            }, 100);
          }
        }
        statusElement.innerHTML = text;
      };

      var Module = {
        print(...args) {
          console.log(args.join(' '));
        },
        canvas: canvasElement,
        setStatus: setStatus,
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : '');
        }
      };
      setStatus('Downloading...');
      window.onerror = (event) => {
        setStatus('Exception thrown, see JavaScript console');
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
